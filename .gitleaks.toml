# Allowlist for scripts/secret-scan.sh (SHP-T-6.6). Every entry below is a known test fixture or
# test-only placeholder, not a real credential — each is annotated with why.
title = "shipyard gitleaks config"

[extend]
useDefault = true

[allowlist]
# gitleaks 8.21's built-in allowlist syntax: paths and regexes are each an array of regex strings.
paths = [
  # A fake GHCR anonymous-token response used by packages/sequence's registry adapter tests
  # (SHP-T-1.3). The "token" decodes to `v1:matdemers1/shipyard/server:<fake timestamp>` — a
  # synthetic fixture value, not a token GHCR ever issued.
  '''packages/sequence/test/fixtures/ghcr/token\.json''',
]

regexes = [
  # The literal string every integration/unit test uses for SESSION_SECRET so cookie signing is
  # deterministic in tests (apps/server/src/auth/cookies.ts consumes it the same as any other
  # value) — never read by, or valid against, a running deployment.
  '''test-session-secret''',

  # Throwaway TOTP base32 seeds for the console-e2e harness's seeded test users (SHP-T-6.2):
  # console-e2e/harness/env.ts's `viewer` fixture and console-e2e/harness/seed.ts's `deployer`
  # user. Both are generated afresh, written only into the `_test` database the harness migrates
  # and wipes on every run (console-e2e/harness/serve.mjs), and are never read by, or valid
  # against, any real deployment. Pinned to their exact literal values, not a pattern, so this
  # allowlist entry cannot shadow a real secret that happens to also be base32.
  '''KRSXG5CTMVRXEZLUKRSXG5CTMVRXEZLU''',
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',

  # The made-up API token apps/web/test/connect.test.tsx (SHP-T-3.12) feeds its mocked POST
  # /api/tokens to check the copied `claude mcp add` command. It never reached a server: the test
  # replaces fetch. Real tokens are random and shown only once. Pinned to the exact literal, which
  # stays in history at b878595, so it cannot shadow a real token.
  '''shp_live_abc123''',

  # The made-up image tag packages/schema/test/host.test.ts (SHP-T-14.3) gives its sample
  # container: `sha-` plus an obviously sequential 40-hex string, the shape of Shipyard's own image
  # tags (`sha-<commit>`), which the generic-api-key rule reads as a key. It names no commit and
  # no image anyone pushed. Pinned to the exact literal, which stays in history at 0cb9818.
  '''sha-0123456789abcdef0123456789abcdef01234567''',

  # The made-up PEM-shaped values the log-redaction tests build (SHP-T-15.3, SHP-REQ-190): a PEM
  # header followed by a JS string-array separator — `-----BEGIN PRIVATE KEY-----', ` — which only an
  # array of lines in test source produces, never a real key file. Their bodies are not keys.
  '''-----BEGIN PRIVATE KEY-----', ''',

  # The registry adapter tests' docker-config `auth` value (SHP-T-16.2): base64 of `hub:secret`, a
  # made-up user and password for a fake Docker Hub. Pinned to the exact literal, which stays in
  # history at 14106f5.
  '''aHViOnNlY3JldA==''',
]
