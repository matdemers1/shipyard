<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" fill="none">
  <title>Shipyard</title>
  <style>
    /* A favicon cannot read the page's CSS variables: the ink is the D3 light and dark --color-fg,
       fixed, and the star is Shipyard's lit star from d3cloud.io (DI-REQ-040) in both. */
    .ink { stroke: #101117; }
    .joint { fill: #101117; }
    .star { fill: #5EEAD4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f0f2f7; }
      .joint { fill: #f0f2f7; }
    }
  </style>
  <g class="ink" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="26" />
    <path d="M18 47 Q21 27 45 18" />
  </g>
  <circle class="joint" cx="18" cy="47" r="3.4" />
  <circle class="joint" cx="25.5" cy="29" r="3.4" />
  <circle class="star" cx="45" cy="18" r="5.5" />
</svg>
